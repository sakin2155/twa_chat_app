<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Mcrypt</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <!-- Navigation Bar -->
    <div class="gallery-navbar">
        <div class="navbar-left">
            <button class="back-btn" id="backBtn" title="Back to Chat">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <h1 class="gallery-title">Gallery</h1>
        </div>
        <div class="navbar-right">
            <button class="upload-btn" id="uploadBtn" title="Upload Image">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
                <span>Upload</span>
            </button>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="upload-modal hidden" id="uploadModal">
        <div class="upload-modal-content">
            <div class="upload-modal-header">
                <h2>Share a Photo</h2>
                <button class="close-btn" id="closeUploadBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="upload-modal-body">
                <!-- Image Preview -->
                <div class="image-preview-container hidden" id="imagePreviewContainer">
                    <img id="imagePreview" class="image-preview" alt="Preview">
                    <button class="change-image-btn" id="changeImageBtn">Change Image</button>
                </div>

                <!-- File Input -->
                <div class="file-input-wrapper" id="fileInputWrapper">
                    <input type="file" id="imageInput" accept="image/*" hidden>
                    <button class="select-image-btn" id="selectImageBtn">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <p>Select Image</p>
                    </button>
                </div>

                <!-- Title Input -->
                <div class="input-group">
                    <label for="imageTitle">Title (Optional)</label>
                    <input type="text" id="imageTitle" placeholder="Add a title for your photo..." maxlength="100">
                    <span class="char-count"><span id="charCount">0</span>/100</span>
                </div>

                <!-- Upload Progress -->
                <div class="upload-progress-container hidden" id="uploadProgressContainer">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <p class="progress-text" id="progressText">Uploading... 0%</p>
                </div>

                <!-- Error Message -->
                <div class="error-message hidden" id="errorMessage"></div>
            </div>

            <div class="upload-modal-footer">
                <button class="btn-cancel" id="cancelUploadBtn">Cancel</button>
                <button class="btn-share" id="shareBtn" disabled>Share</button>
            </div>
        </div>
    </div>

    <!-- Gallery Feed -->
    <div class="gallery-container">
        <div class="gallery-grid" id="galleryGrid">
            <!-- Images will be loaded here -->
        </div>
        <div class="loading-spinner hidden" id="loadingSpinner">
            <div class="spinner"></div>
        </div>
    </div>

    <!-- Full View Modal -->
    <div class="full-view-modal hidden" id="fullViewModal">
        <div class="full-view-content">
            <button class="full-view-close" id="closeFullViewBtn">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <div class="full-view-image-container">
                <img id="fullViewImage" class="full-view-image" alt="Full view">
            </div>

            <div class="full-view-info">
                <div class="full-view-header">
                    <div class="uploader-info">
                        <img id="uploaderAvatar" class="uploader-avatar" alt="Uploader">
                        <div class="uploader-details">
                            <p class="uploader-name" id="uploaderName"></p>
                            <p class="upload-date" id="uploadDate"></p>
                        </div>
                    </div>
                </div>

                <h2 class="full-view-title" id="fullViewTitle"></h2>

                <div class="full-view-actions">
                    <button class="action-btn like-btn" id="likeBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                        </svg>
                        <span id="likeCount">0</span>
                    </button>
                    <button class="action-btn download-btn" id="downloadBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                        Download
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Empty State -->
    <div class="empty-state hidden" id="emptyState">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
        <h2>No Images Yet</h2>
        <p>Be the first to share a photo!</p>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>

    <!-- Gallery Script -->
    <script src="gallery.js"></script>
</body>
</html>
