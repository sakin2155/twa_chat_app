<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe Game</title>
    <link rel="stylesheet" href="games.css">
</head>
<body>
    <!-- Global Loading Screen -->
    <div id="global-loading" class="global-loading">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p class="loading-text">Loading...</p>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="game-container hidden">
        <!-- Main Game Section -->
        <div class="game-main">
            <!-- Header -->
            <div class="game-header">
                <button id="back-to-chat-btn" class="back-btn" title="Back to Chat">← Back</button>
                <h1>Tic-Tac-Toe</h1>
                <div class="header-spacer"></div>
            </div>

            <!-- Status Board -->
            <div class="status-board">
            <div class="player-info player-x">
                <div class="player-avatar" id="player-x-avatar">?</div>
                <div class="player-details">
                    <div class="player-name" id="player-x-name">Player X</div>
                    <div class="player-symbol">X</div>
                </div>
                <div class="player-status" id="player-x-status">Waiting...</div>
            </div>

            <div class="vs-divider">VS</div>

            <div class="player-info player-o">
                <div class="player-avatar" id="player-o-avatar">?</div>
                <div class="player-details">
                    <div class="player-name" id="player-o-name">Player O</div>
                    <div class="player-symbol">O</div>
                </div>
                <div class="player-status" id="player-o-status">Waiting...</div>
            </div>
        </div>

        <!-- Waiting Screen -->
        <div id="waiting-screen" class="waiting-screen">
            <div class="waiting-content">
                <div class="waiting-spinner"></div>
                <p class="waiting-text">Waiting for opponent to join...</p>
                <p class="waiting-hint">Share the link with your friend</p>
            </div>
        </div>

        <!-- Game Board -->
        <div id="game-board" class="game-board hidden">
            <div class="board-grid">
                <button class="board-cell" data-index="0"></button>
                <button class="board-cell" data-index="1"></button>
                <button class="board-cell" data-index="2"></button>
                <button class="board-cell" data-index="3"></button>
                <button class="board-cell" data-index="4"></button>
                <button class="board-cell" data-index="5"></button>
                <button class="board-cell" data-index="6"></button>
                <button class="board-cell" data-index="7"></button>
                <button class="board-cell" data-index="8"></button>
            </div>
            <div class="turn-indicator" id="turn-indicator">Your Turn</div>
            
            <!-- Game Controls -->
            <div class="game-controls">
                <button id="give-turn-btn" class="control-btn" title="Give first turn to opponent">
                    🔄 Give Turn
                </button>
            </div>
        </div>
        </div>

        <!-- In-Game Chat Section -->
        <div class="game-chat">
            <div class="chat-header">💬 Chat</div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="chat-input-container">
                <input 
                    type="text" 
                    id="chat-input" 
                    class="chat-input" 
                    placeholder="Type a message..."
                    maxlength="100"
                >
                <button id="send-chat-btn" class="send-btn">Send</button>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="game-over-modal" class="modal hidden">
            <div class="modal-content game-over-content">
                <div class="game-over-message" id="game-over-message">
                    🏆 You Won!
                </div>
                <button id="play-again-btn" class="play-again-btn">Play Again</button>
                <button id="back-to-chat-from-modal-btn" class="secondary">Back to Chat</button>
            </div>
        </div>
    </div>

    <!-- Login Modal (if not authenticated) -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <h2>Sign In Required</h2>
            <p>Please sign in to play games.</p>
            <button id="go-to-login-btn" class="primary">Go to Login</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module" src="games.js"></script>
</body>
</html>
