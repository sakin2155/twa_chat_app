<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Assistant - Mcrypt</title>
    <link rel="stylesheet" href="ai-assistant.css">
    <!-- Lucide Icons CDN -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest"></script>
</head>

<body>
    <div class="ai-assistant-container">
        <!-- Header -->
        <div class="ai-assistant-header">
            <button id="back-btn" class="back-btn" title="Back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
            </button>
            <div class="header-title">
                <div class="header-icon">
                    <img src="images/ai logo.jpg" alt="Aria Logo" class="header-logo">
                </div>
                <div class="header-info">
                    <h2>Aria 💕</h2>
                    <p class="header-subtitle">Your AI Companion</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="header-action-btn" title="Clear Chat" id="clear-chat-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3,6 5,4 21,4 23,6 23,20"></polyline>
                        <path d="M3 20a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Messages Container -->
        <div class="ai-messages-container" id="ai-messages-container">
            <div class="welcome-message">
                <div class="welcome-icon-container">
                    <img src="images/ai logo.jpg" alt="Aria Logo" class="welcome-logo">
                </div>
                <h3>Hey! I'm Aria 💕</h3>
                <p>I'm your companion, confidant, and friend. I'm here to listen, support you, and just be there for
                    you. Tell me about yourself—what's on your mind? 💗</p>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="ai-typing-indicator hidden" id="ai-typing-indicator">
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <span class="typing-text">AI is thinking...</span>
        </div>

        <!-- Input Area -->
        <div class="ai-input-area">
            <div class="ai-input-wrapper">
                <textarea id="ai-message-input" placeholder="Ask me anything... (Shift+Enter to send)" rows="1"
                    spellcheck="true"></textarea>
                <button id="ai-send-btn" class="ai-send-btn" title="Send Message (or Shift+Enter)">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                        <path
                            d="M16.6915026,12.4744748 L3.50612381,13.2599618 C3.19218622,13.2599618 3.03521743,13.4170592 3.03521743,13.5741566 L1.15159189,20.0151496 C0.8376543,20.8006365 0.99,21.89 1.77946707,22.52 C2.41,22.99 3.50612381,23.1 4.13399899,22.8429026 L21.714504,14.0454487 C22.6563168,13.5741566 23.1272231,12.6315722 22.9702544,11.6889879 L4.13399899,1.16346272 C3.34915502,0.9 2.40734225,1.00636533 1.77946707,1.4776575 C0.994623095,2.10604706 0.837654326,3.0486314 1.15159189,3.99701575 L3.03521743,10.4380088 C3.03521743,10.5951061 3.34915502,10.7522035 3.50612381,10.7522035 L16.6915026,11.5376905 C16.6915026,11.5376905 17.1624089,11.5376905 17.1624089,12.0089827 C17.1624089,12.4744748 16.6915026,12.4744748 16.6915026,12.4744748 Z" />
                    </svg>
                </button>
            </div>
        </div>

        <!-- Error Message -->
        <div id="ai-error-message" class="ai-error-message hidden"></div>
    </div>

    <script type="module" src="ai-assistant.js"></script>
</body>

</html>
